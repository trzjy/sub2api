# Web login proxy: isolated subdomain wlp.corealgos.com (port 3400 backend)
# Migrated from corealgos.com:8443 (port-based origin shares cookie namespace
# with main site on :443; subdomain isolates cookies per host).
#
# Security note: wlp cookies stay host-only (no Domain=.corealgos.com).
# This prevents cookie leakage between main site and proxy origin.
#
# TLS: uses wildcard cert *.corealgos.com (from /etc/letsencrypt/live/corealgos.com-0001/)
# issued via DNS-01 with Cloudflare API token (see /etc/letsencrypt/cloudflare.ini).
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name wlp.corealgos.com;

    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:3400;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    ssl_certificate /etc/letsencrypt/live/corealgos.com-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/corealgos.com-0001/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
