# corealgos.com - Sub2API production site

map $http_upgrade $sub2api_connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 80;
    server_name corealgos.com www.corealgos.com;
    client_max_body_size 512m;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/duizhang;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name corealgos.com www.corealgos.com;
    client_max_body_size 512m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://127.0.0.1:3300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $sub2api_connection_upgrade;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    ssl_certificate /etc/letsencrypt/live/corealgos.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/corealgos.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}