services:
  sub2api:
    image: sub2api:01e3451
    container_name: sub2api
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ulimits:
      nofile:
        soft: 100000
        hard: 100000
    ports:
      - "${BIND_HOST:-127.0.0.1}:${SERVER_PORT:-3300}:8080"
    volumes:
      - ../data:/app/data
    env_file:
      - ../.env
    environment:
      AUTO_SETUP: "true"
      SERVER_HOST: "0.0.0.0"
      SERVER_PORT: "8080"
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${POSTGRES_USER:-sub2api}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_DBNAME: ${POSTGRES_DB:-sub2api}
      DATABASE_SSLMODE: disable
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_USERNAME: ""
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_ENABLE_TLS: "false"
      TZ: ${TZ:-Asia/Shanghai}
      JWT_SECRET: ${JWT_SECRET}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sub2api-network
      - xianyu-internal
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "5", "-O", "/dev/null", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  postgres:
    image: postgres:15-alpine
    container_name: sub2api-postgres
    restart: unless-stopped
    volumes:
      - ../postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sub2api}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-sub2api}
      PGDATA: /var/lib/postgresql/data
      TZ: ${TZ:-Asia/Shanghai}
    networks:
      - sub2api-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sub2api} -d ${POSTGRES_DB:-sub2api}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: sub2api-redis
    restart: unless-stopped
    command: ["redis-server"]
    volumes:
      - ../redis_data:/data
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    networks:
      - sub2api-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # xianyu-auto-reply Worker：内网专用，只加入 xianyu-internal 网络，不映射任何公网端口。
  # 镜像为内部维护的固定版本（不使用 latest 漂浮标签），由运维在部署前 pin 到经审查的
  # 上游 commit 构建产物。主程序通过 Docker 内部别名 xianyu-worker-backend 访问。
  xianyu-worker:
    image: xianyu-auto-reply:${XIANYU_WORKER_IMAGE_TAG:-reviewed}
    container_name: xianyu-worker
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    # 不映射任何宿主机端口：Worker 前端/后端/WebSocket 全部内网。
    volumes:
      - ../xianyu_worker_data:/app/data
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      HOST: "0.0.0.0"
      # Worker 回传主程序的内网地址与双向认证 token：部署时固定注入。
      SUB2API_INTERNAL_BASE_URL: "http://sub2api:8080"
      SUB2API_INTERNAL_TOKEN: ${XIANYU_INTERNAL_TOKEN}
      MYSQL_HOST: xianyu-worker-mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: ${XIANYU_WORKER_MYSQL_USER:-xianyu}
      MYSQL_PASSWORD: ${XIANYU_WORKER_MYSQL_PASSWORD}
      MYSQL_DATABASE: ${XIANYU_WORKER_MYSQL_DB:-xianyu}
      REDIS_HOST: xianyu-worker-redis
      REDIS_PORT: "6379"
    depends_on:
      xianyu-worker-mysql:
        condition: service_healthy
      xianyu-worker-redis:
        condition: service_healthy
    networks:
      xianyu-internal:
        aliases:
          - xianyu-worker-backend
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8089/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  xianyu-worker-mysql:
    image: mysql:8.0
    container_name: xianyu-worker-mysql
    restart: unless-stopped
    # 宿主机端口绑定为空：仅内网。
    volumes:
      - ../xianyu_worker_mysql:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${XIANYU_WORKER_MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${XIANYU_WORKER_MYSQL_USER:-xianyu}
      MYSQL_PASSWORD: ${XIANYU_WORKER_MYSQL_PASSWORD}
      MYSQL_DATABASE: ${XIANYU_WORKER_MYSQL_DB:-xianyu}
      TZ: ${TZ:-Asia/Shanghai}
    networks:
      xianyu-internal: null
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${XIANYU_WORKER_MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  xianyu-worker-redis:
    image: redis:7-alpine
    container_name: xianyu-worker-redis
    restart: unless-stopped
    command: ["redis-server"]
    volumes:
      - ../xianyu_worker_redis:/data
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    networks:
      xianyu-internal: null
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

networks:
  sub2api-network:
    driver: bridge
  xianyu-internal:
    driver: bridge
